stages:
  - build

build-windows:
  stage: build
  tags:
    - windows
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - uv sync --extra build
    - uv run pyinstaller packaging/mcp_1c77.spec --clean --noconfirm
  artifacts:
    paths:
      - dist/mcp-1c77.exe
    expire_in: 1 week
