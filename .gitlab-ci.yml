stages:
  - build

build-windows:
  stage: build
  tags:
    - windows
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  variables:
    GIT_DEPTH: 0
  script:
    - uv sync --extra build
    - uv run pyinstaller packaging/mcp_1c77.spec --clean --noconfirm
    - $VERSION_TAG = git describe --tags --abbrev=0
    - Move-Item dist/mcp-1c77.exe "dist/mcp-1c77-$VERSION_TAG.exe"
  artifacts:
    paths:
      - dist/mcp-1c77-*.exe
    expire_in: 1 week
